name: Security Scan CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest tests/ -v

  scan:
    runs-on: ubuntu-latest
    needs: test
    services:
      dvwa:
        image: vulnerables/web-dvwa
        ports:
          - 80:80

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for DVWA to start
        run: |
          echo "Waiting for DVWA..."
          sleep 30
          curl -s http://localhost/login.php | grep -q "login" && echo "DVWA ready" || echo "DVWA not ready but continuing"

      - name: Run vulnerability scan
        run: python scanner/main.py --target http://localhost --output html

      - name: Upload scan report
        uses: actions/upload-artifact@v4
        with:
          name: scan-report
          path: reports/

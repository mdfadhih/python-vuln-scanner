name: Security Scan CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest tests/ -v

  scan:
    runs-on: ubuntu-latest
    needs: test
    services:
      dvwa:
        image: vulnerables/web-dvwa
        ports:
          - 80:80
        options: --health-cmd="curl -f http://localhost/login.php" --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for DVWA
        run: sleep 15

      - name: Run vulnerability scan
        run: python scanner/main.py --target http://localhost --output html

      - name: Upload scan report
        uses: actions/upload-artifact@v4
        with:
          name: scan-report
          path: reports/
